<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Tutor - Lesson</title>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; }
        .lesson-area { flex: 2; padding: 40px; background: #fff; }
        .ai-sidebar { flex: 1; background: #f8f9fa; border-left: 2px solid #ddd; display: flex; flex-direction: column; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; }
        .input-area { padding: 20px; border-top: 1px solid #ddd; display: flex; }
        input { flex: 1; padding: 10px; border-radius: 5px; border: 1px solid #ddd; }
        .msg { margin-bottom: 10px; padding: 10px; border-radius: 8px; }
        .bot { background: #e8f0fe; align-self: flex-start; }
    </style>
</head>
<body>
    <div class="lesson-area">
        <a href="index.html">← Back</a>
        <h1>Lesson: Intro to Python</h1>
        <div style="width: 100%; height: 300px; background: #000; color: white; display: flex; align-items: center; justify-content: center;">
            [Video Lesson Content]
        </div>
    </div>
    <div class="ai-sidebar">
        <div style="padding: 20px; background: #1a73e8; color: white;">🤖 AI Tutor</div>
        <div class="chat-box" id="chat">
            <div class="msg bot">Hi! I'm your AI Tutor. Stuck on something? Ask me anything!</div>
        </div>
        <div class="input-area">
            <input type="text" placeholder="Ask AI..." onkeypress="if(event.key === 'Enter') alert('AI response is not connected yet, but look how good this UI looks!')">
        </div>
    </div>
</body>
</html>
